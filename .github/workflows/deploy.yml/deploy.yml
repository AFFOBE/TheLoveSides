name: TheLoveSides Auto Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: thelovesides-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/thelovesides_key
          chmod 600 ~/.ssh/thelovesides_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Verify VPS connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/thelovesides_key \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            'test -d /var/www/TheLoveSides && echo "VPS connected; project found"'
